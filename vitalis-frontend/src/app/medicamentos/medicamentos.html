<div class="page-container">
  <div class="page-header">
    <div>
      <h1>Medicamentos</h1>
      <p>Catálogo de medicamentos para prescripciones</p>
    </div>
    <button class="btn-primary" (click)="abrirNuevo()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Nuevo Medicamento
    </button>
  </div>

  <div class="search-bar">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Buscar medicamento..." [(ngModel)]="searchTerm" (input)="buscar()" />
  </div>

  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr><th>Nombre</th><th>Presentación</th><th>Estado</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let m of medicamentos">
          <td><span class="cell-primary">{{ m.nombre }}</span></td>
          <td>{{ m.presentacion || '-' }}</td>
          <td><span class="status-badge" [ngClass]="m.activo ? 'status-success' : 'status-danger'">{{ m.activo ? 'Activo' : 'Inactivo' }}</span></td>
          <td class="actions-cell">
            <button class="btn-icon" title="Editar" (click)="abrirEditar(m)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
            <button class="btn-icon btn-icon-danger" title="Eliminar" (click)="eliminar(m)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
          </td>
        </tr>
        <tr *ngIf="medicamentos.length === 0"><td colspan="4" class="empty-state">Sin medicamentos registrados</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="cerrarModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header"><h2>{{ editMode ? 'Editar Medicamento' : 'Nuevo Medicamento' }}</h2><button class="btn-close" (click)="cerrarModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Nombre *</label><input type="text" [(ngModel)]="form.nombre" required /></div>
      <div class="form-group"><label>Presentación</label><input type="text" [(ngModel)]="form.presentacion" placeholder="Ej: 500 mg comprimidos" /></div>
    </div>
    <div class="modal-footer"><button class="btn-secondary" (click)="cerrarModal()">Cancelar</button><button class="btn-primary" (click)="guardar()">{{ editMode ? 'Guardar' : 'Crear' }}</button></div>
  </div>
</div>
