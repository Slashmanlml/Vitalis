<div class="auth">
  <app-panel-marca
    titulo="El consultorio, en orden."
    bajada="Turnos, historias clínicas, recetas y facturación en un mismo lugar, con cada persona viendo solo lo que le corresponde.">
  </app-panel-marca>

  <main class="auth-lado">
    <div class="auth-form" [class.sacudir]="sacudir">
      <header class="auth-encabezado">
        <h1>Iniciar sesión</h1>
        <p>Ingresá con el correo y la contraseña de tu cuenta.</p>
      </header>

      <div class="aviso aviso-error" id="aviso-login" *ngIf="errorMsg" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>
          <p>{{ errorMsg }}</p>
          <div class="aviso-acciones" *ngIf="puedeReenviar">
            <button type="button" class="boton-texto" (click)="reenviar()" [disabled]="reenviando">
              {{ reenviando ? 'Enviando el correo' : 'Enviarme el enlace de nuevo' }}
            </button>
          </div>
        </div>
      </div>

      <div class="aviso aviso-ok" *ngIf="infoMsg" role="status">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        <p>{{ infoMsg }}</p>
      </div>

      <form (ngSubmit)="login()" novalidate class="campos">
        <div class="campo-grupo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" class="entrada" [class.invalido]="intentoEnviar && !email.trim()" [(ngModel)]="email" autocomplete="username" placeholder="nombre@gmail.com" [disabled]="isLoading">
        </div>

        <div class="campo-grupo">
          <label for="password">
            Contraseña
            <a routerLink="/olvide-password" [state]="{ email: email.trim() }" class="olvide">¿Te la olvidaste?</a>
          </label>
          <app-campo-password inputId="password" name="password" autocomplete="current-password"
            [(valor)]="password" [invalido]="intentoEnviar && !!errorMsg && !infoMsg" [disabled]="isLoading">
          </app-campo-password>
        </div>

        <button type="submit" class="boton-principal" [disabled]="isLoading">
          <span class="cargando-punto" *ngIf="isLoading" aria-hidden="true"></span>
          {{ isLoading ? 'Ingresando' : 'Ingresar' }}
        </button>
      </form>

      <p class="enlaces">¿Sos paciente y todavía no tenés cuenta? <a routerLink="/registro">Creá tu cuenta</a></p>

      <!-- Solo en desarrollo: en producción los usuarios de prueba no existen
           (ver Semilla:DatosDemo) y no tiene sentido publicar sus contraseñas. -->
      <p class="demo" *ngIf="mostrarCredencialesDemo">
        Usuario de prueba para la demostración: <code>admin&#64;vitalis.local</code> con la contraseña <code>Admin123!</code>
      </p>
    </div>
  </main>
</div>
