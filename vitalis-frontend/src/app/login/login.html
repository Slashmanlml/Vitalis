<div class="login-wrapper">
  <div class="login-decor">
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>
  </div>
  
  <div class="login-card glass-panel">
    <div class="brand-section">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="heart-pulse-icon">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
          <path d="M3.22 12H9.5l1.5-3 2 6 1.5-3h4.78"/>
        </svg>
      </div>
      <h1 class="brand-name">Vitalis</h1>
      <p class="brand-subtitle">Gestión de Consultorio Médico Virtual</p>
    </div>

    <!-- Banner de error inline -->
    <div class="error-banner" *ngIf="errorMsg">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>{{ errorMsg }}</span>
    </div>

    <form (ngSubmit)="login()" class="login-form">
      <div class="form-group">
        <label for="email" class="form-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <input type="email" id="email" [(ngModel)]="email" name="email" class="form-input" placeholder="ejemplo@vitalis.local" required autocomplete="email" [disabled]="isLoading">
        </div>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <input type="password" id="password" [(ngModel)]="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" [disabled]="isLoading">
        </div>
      </div>

      <button type="submit" class="btn-primary login-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Ingresar al Sistema</span>
        <span *ngIf="isLoading" class="spinner-text">Procesando...</span>
        <svg *ngIf="!isLoading" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

    </form>

    <div class="login-footer">
      <p>Credenciales de Tesis: <code>admin@vitalis.local</code> / <code>Admin123!</code></p>
    </div>
  </div>
</div>
