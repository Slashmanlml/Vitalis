# ---------------------------------------------------------------------------
# nginx del frontend de Vitalis.
#
# El mismo archivo sirve en las dos formas de levantar el sistema:
#   - Local (docker compose up): el navegador habla directo con nginx por
#     http://localhost:8080.
#   - Producción (docker-compose.prod.yml): el navegador habla con Cloudflare
#     por HTTPS; Cloudflare manda el pedido por el túnel al contenedor
#     cloudflared, y cloudflared se lo pasa a nginx por la red interna.
#
# Los "map" van fuera del bloque server: nginx:alpine incluye este archivo
# dentro de su bloque http, que es donde tienen que estar.
# ---------------------------------------------------------------------------

# Protocolo con el que llegó el pedido al primer equipo de la cadena. Detrás
# del túnel nginx recibe http, pero el usuario usó https: Cloudflare lo avisa
# en X-Forwarded-Proto. Si no viene (uso local), vale el protocolo propio.
map $http_x_forwarded_proto $protocolo_original {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS solo cuando el sitio se está usando por HTTPS. Con http (local) el
# valor queda vacío y nginx no manda la cabecera: activarlo ahí haría que el
# navegador se niegue a volver a entrar por http://localhost.
map $protocolo_original $cabecera_hsts {
    https   "max-age=31536000";
    default "";
}

# Caché del navegador. Los .js y .css de Angular llevan un código en el nombre
# que cambia con cada versión (main-AB12cd34.js), así que pueden guardarse un
# año. index.html no: siempre se revalida, para que una versión nueva llegue
# apenas se publica. La API y los adjuntos deciden su propia caché (vacío =
# nginx no agrega nada). El regex va entre comillas por las llaves {8}.
map $uri $cabecera_cache {
    ~^/api/                                 "";
    ~^/uploads/                             "";
    "~*-[a-z0-9_-]{8}\.(?:js|css)$"         "public, max-age=31536000, immutable";
    default                                 "no-cache";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la versión de nginx en errores y cabeceras.
    server_tokens off;

    # La API acepta adjuntos de hasta 5 MB (UploadsController). El límite por
    # defecto de nginx es 1 MB: sin esta línea, una foto de 2 MB se cortaba acá
    # con un 413 y nunca llegaba a la API. Se deja un margen para el resto del
    # formulario.
    client_max_body_size 6m;

    # --- IP real del visitante ---
    # Detrás del túnel, quien le habla a nginx es el contenedor cloudflared
    # (una IP de la red interna de Docker). La IP del visitante viene en
    # CF-Connecting-IP, que pone Cloudflare y el visitante no puede falsear.
    # Solo se le cree a ese encabezado si el pedido llega desde las redes
    # internas de Docker; en producción no hay ningún puerto publicado, así que
    # no hay otra forma de llegar a nginx.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   CF-Connecting-IP;

    # --- Cabeceras de seguridad de la aplicación (auditoría de seguridad) ---
    # CSP: los scripts solo pueden venir de este mismo origen; nada de scripts
    # en línea ni de terceros. Es la defensa principal si alguna vez se cuela
    # un XSS, y además protege el token guardado en localStorage.
    # 'unsafe-inline' en estilos lo exige Angular (estilos de componentes) y
    # el cuerpo de los mails que se previsualiza en Notificaciones.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $cabecera_hsts always;
    add_header Cache-Control $cabecera_cache;
    # Importante: ningún location de abajo usa add_header. En nginx, un
    # add_header dentro de un location anula TODOS los del server, y se
    # perderían las cabeceras de seguridad en esa ruta.

    # Angular es una aplicacion de una sola pagina: las rutas como
    # /dashboard/turnos no son archivos en el disco. Si el archivo no existe se
    # devuelve index.html y el router del navegador resuelve. Sin esta linea,
    # recargar la pagina en cualquier ruta interna da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API vive en otro contenedor, pero se expone bajo el mismo origen. Por
    # eso el navegador nunca hace una peticion entre origenes y CORS no entra en
    # juego.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Se REEMPLAZA X-Forwarded-For en lugar de agregarle la IP al final.
        # La API toma solo el último valor de la lista; si se agregara, ese
        # último sería cloudflared y todos los visitantes compartirían el mismo
        # límite de intentos de login. $remote_addr ya es la IP real (ver
        # real_ip_header arriba), y además así nadie puede colar una IP
        # inventada al principio de la lista.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $protocolo_original;
    }

    # Fotos de perfil y estudios adjuntos: los sirve la API desde su wwwroot.
    location /uploads/ {
        proxy_pass       http://api:8080/uploads/;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
