<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitalis – Iniciar Sesión</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="glass-panel login-card">
    <div class="login-header">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color); margin-bottom: 0.5rem;">
        <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
      </svg>
      <h1>Vitalis</h1>
      <p>Gestión de Consultorio Médico</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" placeholder="nombre@ejemplo.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        <span>Ingresar</span>
      </button>
    </form>
  </div>

  <!-- Toast Container for Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
</body>
</html>
