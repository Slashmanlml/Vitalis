<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vitalis – Portal de Gestión</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-color);">
          <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
        </svg>
        <h1>Vitalis</h1>
      </div>
      <div class="user-info">
        <div class="user-badge">
          Usuario: <strong id="userName">Cargando...</strong> (<span id="userRole">-</span>)
        </div>
        <button id="logoutBtn" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
      </div>
    </header>

    <main class="glass-panel" style="padding: 2rem;">
      <div class="tabs-header" id="navTabs">
        <button class="tab-btn active" data-tab="pacientes">Pacientes</button>
        <button class="tab-btn" data-tab="obras">Obras Sociales</button>
        <button class="tab-btn" data-tab="especialidades">Especialidades</button>
        <button class="tab-btn" data-tab="profesionales">Profesionales</button>
        <button class="tab-btn" data-tab="turnos">Turnos</button>
      </div>

      <div id="tabContent">
        <!-- Rendered dynamically by app.js -->
      </div>
    </main>
  </div>

  <!-- Modal Template for Create / Edit -->
  <div class="modal" id="formModal">
    <div class="glass-panel modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Formulario</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <form id="entityForm">
        <!-- Fields injected by app.js -->
      </form>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button type="button" class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Toast Container for Notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
</body>
</html>
