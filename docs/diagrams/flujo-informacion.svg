<svg viewBox="0 0 1180 1196" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif">
<rect x="0" y="0" width="1180" height="1196" fill="#FFFFFF"/>
<text x="590" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1F4E79">Vitalis — Flujo de información: turno → consulta → receta → factura → reporte</text>
<text x="590" y="56" text-anchor="middle" font-size="12" fill="#555555">Proceso completo, de punta a punta, con los roles responsables de cada paso y la tabla afectada en PostgreSQL.</text>
<rect x="60" y="80" width="12" height="12" fill="#FDF3D8" stroke="#B8860B" stroke-width="1.3"/>
<text x="78" y="90" font-size="10.5" fill="#333333">Recepcionista</text>
<rect x="185.89999999999998" y="80" width="12" height="12" fill="#F5E6F5" stroke="#7B2D8B" stroke-width="1.3"/>
<text x="203.89999999999998" y="90" font-size="10.5" fill="#333333">Médico</text>
<rect x="267.7" y="80" width="12" height="12" fill="#FBE4E4" stroke="#B03A3A" stroke-width="1.3"/>
<text x="285.7" y="90" font-size="10.5" fill="#333333">Facturación</text>
<rect x="381" y="80" width="12" height="12" fill="#E7EEF5" stroke="#1F4E79" stroke-width="1.3"/>
<text x="399" y="90" font-size="10.5" fill="#333333">Administrador</text>
<rect x="506.9" y="80" width="12" height="12" fill="#E9E9E9" stroke="#555555" stroke-width="1.3"/>
<text x="524.9" y="90" font-size="10.5" fill="#333333">Sistema (automático)</text>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#1F4E79"/></marker></defs>
<rect x="740" y="550" width="220" height="90" rx="8" fill="#E9E9E9" stroke="#555555" stroke-width="1.3"/>
<text x="850" y="572" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">Auditoría automática</text>
<text x="850" y="590" text-anchor="middle" font-size="10" fill="#333333">Toda escritura marcada (●)</text>
<text x="850" y="604" text-anchor="middle" font-size="10" fill="#333333">genera un registro en</text>
<text x="850" y="618" text-anchor="middle" font-size="10" fill="#333333">Auditoria: tabla, acción,</text>
<text x="850" y="632" text-anchor="middle" font-size="10" fill="#333333">usuario y valores.</text>
<g>
<rect x="60" y="130" width="620" height="56" rx="7" fill="#FDF3D8" stroke="#B8860B" stroke-width="1.4"/>
<rect x="60" y="130" width="6" height="56" fill="#B8860B"/>
<text x="78" y="148" font-size="9.5" font-weight="bold" fill="#B8860B">01 · RECEPCIONISTA</text>
<text x="78" y="166" font-size="12" fill="#1A1A1A">Crea el turno (paciente, profesional, fecha/hora)</text>
<text x="78" y="180" font-size="9.5" font-style="italic" fill="#555555">INSERT Turno</text>
<circle cx="664" cy="146" r="6" fill="#555555"/>
<line x1="680" y1="158" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="186" x2="370" y2="216" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="216" width="620" height="56" rx="7" fill="#E9E9E9" stroke="#555555" stroke-width="1.4"/>
<rect x="60" y="216" width="6" height="56" fill="#555555"/>
<text x="78" y="234" font-size="9.5" font-weight="bold" fill="#555555">02 · SISTEMA (AUTOMÁTICO)</text>
<text x="78" y="252" font-size="12" fill="#1A1A1A">Envía email de confirmación (simulado)</text>
<text x="78" y="266" font-size="9.5" font-style="italic" fill="#555555">INSERT EmailLog</text>
</g>
<line x1="370" y1="272" x2="370" y2="302" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="302" width="620" height="56" rx="7" fill="#FDF3D8" stroke="#B8860B" stroke-width="1.4"/>
<rect x="60" y="302" width="6" height="56" fill="#B8860B"/>
<text x="78" y="320" font-size="9.5" font-weight="bold" fill="#B8860B">03 · RECEPCIONISTA</text>
<text x="78" y="338" font-size="12" fill="#1A1A1A">El día del turno: ingresa al paciente a sala de espera</text>
<text x="78" y="352" font-size="9.5" font-style="italic" fill="#555555">UPDATE Turno.Estado</text>
<circle cx="664" cy="318" r="6" fill="#555555"/>
<line x1="680" y1="330" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="358" x2="370" y2="388" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="388" width="620" height="56" rx="7" fill="#F5E6F5" stroke="#7B2D8B" stroke-width="1.4"/>
<rect x="60" y="388" width="6" height="56" fill="#7B2D8B"/>
<text x="78" y="406" font-size="9.5" font-weight="bold" fill="#7B2D8B">04 · MÉDICO</text>
<text x="78" y="424" font-size="12" fill="#1A1A1A">Llama al paciente y marca inicio de atención</text>
<text x="78" y="438" font-size="9.5" font-style="italic" fill="#555555">UPDATE Turno.Estado</text>
<circle cx="664" cy="404" r="6" fill="#555555"/>
<line x1="680" y1="416" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="444" x2="370" y2="474" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="474" width="620" height="56" rx="7" fill="#F5E6F5" stroke="#7B2D8B" stroke-width="1.4"/>
<rect x="60" y="474" width="6" height="56" fill="#7B2D8B"/>
<text x="78" y="492" font-size="9.5" font-weight="bold" fill="#7B2D8B">05 · MÉDICO</text>
<text x="78" y="510" font-size="12" fill="#1A1A1A">Registra la consulta médica (motivo, diagnóstico, evolución)</text>
<text x="78" y="524" font-size="9.5" font-style="italic" fill="#555555">INSERT ConsultaMedica · UPDATE Turno.Estado</text>
<circle cx="664" cy="490" r="6" fill="#555555"/>
<line x1="680" y1="502" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="530" x2="370" y2="560" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="560" width="620" height="56" rx="7" fill="#F5E6F5" stroke="#7B2D8B" stroke-width="1.4"/>
<rect x="60" y="560" width="6" height="56" fill="#7B2D8B"/>
<text x="78" y="578" font-size="9.5" font-weight="bold" fill="#7B2D8B">06 · MÉDICO</text>
<text x="78" y="596" font-size="12" fill="#1A1A1A">Registra antecedentes y/o alergias, si corresponde</text>
<text x="78" y="610" font-size="9.5" font-style="italic" fill="#555555">INSERT AntecedenteClinico / Alergia</text>
<circle cx="664" cy="576" r="6" fill="#555555"/>
<line x1="680" y1="588" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="616" x2="370" y2="646" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="646" width="620" height="56" rx="7" fill="#F5E6F5" stroke="#7B2D8B" stroke-width="1.4"/>
<rect x="60" y="646" width="6" height="56" fill="#7B2D8B"/>
<text x="78" y="664" font-size="9.5" font-weight="bold" fill="#7B2D8B">07 · MÉDICO</text>
<text x="78" y="682" font-size="12" fill="#1A1A1A">Emite la prescripción (medicamentos, dosis, frecuencia)</text>
<text x="78" y="696" font-size="9.5" font-style="italic" fill="#555555">INSERT Prescripcion + PrescripcionDetalle</text>
<circle cx="664" cy="662" r="6" fill="#555555"/>
<line x1="680" y1="674" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="702" x2="370" y2="732" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="732" width="620" height="56" rx="7" fill="#FBE4E4" stroke="#B03A3A" stroke-width="1.4"/>
<rect x="60" y="732" width="6" height="56" fill="#B03A3A"/>
<text x="78" y="750" font-size="9.5" font-weight="bold" fill="#B03A3A">08 · FACTURACIÓN</text>
<text x="78" y="768" font-size="12" fill="#1A1A1A">Genera la factura con las prestaciones realizadas</text>
<text x="78" y="782" font-size="9.5" font-style="italic" fill="#555555">INSERT Factura + FacturaDetalle</text>
<circle cx="664" cy="748" r="6" fill="#555555"/>
<line x1="680" y1="760" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="788" x2="370" y2="818" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="818" width="620" height="56" rx="7" fill="#FBE4E4" stroke="#B03A3A" stroke-width="1.4"/>
<rect x="60" y="818" width="6" height="56" fill="#B03A3A"/>
<text x="78" y="836" font-size="9.5" font-weight="bold" fill="#B03A3A">09 · FACTURACIÓN</text>
<text x="78" y="854" font-size="12" fill="#1A1A1A">Registra el pago del paciente</text>
<text x="78" y="868" font-size="9.5" font-style="italic" fill="#555555">INSERT Pago · UPDATE Factura.Estado</text>
<circle cx="664" cy="834" r="6" fill="#555555"/>
<line x1="680" y1="846" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="874" x2="370" y2="904" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="904" width="620" height="56" rx="7" fill="#FBE4E4" stroke="#B03A3A" stroke-width="1.4"/>
<rect x="60" y="904" width="6" height="56" fill="#B03A3A"/>
<text x="78" y="922" font-size="9.5" font-weight="bold" fill="#B03A3A">10 · FACTURACIÓN</text>
<text x="78" y="940" font-size="12" fill="#1A1A1A">Liquida los honorarios del profesional (por período)</text>
<text x="78" y="954" font-size="9.5" font-style="italic" fill="#555555">INSERT Liquidacion</text>
<circle cx="664" cy="920" r="6" fill="#555555"/>
<line x1="680" y1="932" x2="740" y2="595" stroke="#AAAAAA" stroke-width="1" stroke-dasharray="3,3"/>
</g>
<line x1="370" y1="960" x2="370" y2="990" stroke="#1F4E79" stroke-width="2" marker-end="url(#arr)"/>
<g>
<rect x="60" y="990" width="620" height="56" rx="7" fill="#E7EEF5" stroke="#1F4E79" stroke-width="1.4"/>
<rect x="60" y="990" width="6" height="56" fill="#1F4E79"/>
<text x="78" y="1008" font-size="9.5" font-weight="bold" fill="#1F4E79">11 · ADMINISTRADOR</text>
<text x="78" y="1026" font-size="12" fill="#1A1A1A">Consulta reportes (turnos, ingresos, ausentismo, etc.)</text>
<text x="78" y="1040" font-size="9.5" font-style="italic" fill="#555555">SELECT agregados sobre Turno/Factura/ConsultaMedica</text>
</g>
<text x="60" y="1156" font-size="10.5" font-style="italic" fill="#555555">● = paso que dispara un registro automático de auditoría. El flujo es lineal en el caso típico; en la práctica, la Recepción</text>
<text x="60" y="1172" font-size="10.5" font-style="italic" fill="#555555">puede reprogramar/cancelar turnos y Facturación puede operar en paralelo sobre pacientes atendidos en otros consultorios.</text>
</svg>